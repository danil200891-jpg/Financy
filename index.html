<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#06070D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finance" />
    <link rel="icon" href="%BASE_URL%favicon-cbbb563605.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon-cbbb563605.png" sizes="180x180" />
    <title>Finance</title>
    <script>
      /* Boot watchdog — plain ES5 on purpose: it must run even when the main bundle cannot.
         If the app has not started within 10 s it shows what went wrong instead of a black screen. */
      (function () {
        var errors = [];
        var state = { stage: 'html', done: false, failed: false };
        function msg(e) {
          if (!e) return 'неизвестная ошибка';
          if (e.message) return e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '');
          if (e.reason) return 'Promise: ' + (e.reason.message || String(e.reason));
          return String(e);
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && t !== window && (t.src || t.href)) errors.push('Не загрузился файл: ' + (t.src || t.href));
          else errors.push(msg(e));
        }, true);
        window.addEventListener('unhandledrejection', function (e) { errors.push(msg(e)); });

        function show(title, extra) {
          if (state.done || state.failed) return;
          state.failed = true;
          var lines = [];
          if (extra) lines.push(extra);
          for (var i = 0; i < errors.length && i < 6; i++) lines.push(errors[i]);
          lines.push('Этап: ' + state.stage);
          lines.push('Браузер: ' + navigator.userAgent);
          var box = document.createElement('div');
          box.setAttribute('style', 'position:fixed;inset:0;z-index:99999;overflow:auto;background:#06070D;color:#F2F3F8;' +
            'font:16px/1.45 -apple-system,system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 28px) 22px 40px');
          var html = '<div style="font-size:22px;font-weight:700;margin-bottom:10px">' + title + '</div>' +
            '<div style="color:#8B90A6;margin-bottom:18px">Сделайте снимок экрана и пришлите его — по нему видно причину.</div>' +
            '<pre style="white-space:pre-wrap;word-break:break-word;font:13px/1.5 ui-monospace,Menlo,monospace;background:rgba(255,255,255,.06);' +
            'border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px;margin:0 0 20px"></pre>' +
            '<button id="b-reload" style="display:block;width:100%;height:52px;border:0;border-radius:16px;margin-bottom:10px;' +
            'background:linear-gradient(120deg,#7c8cff,#9f6bff);color:#fff;font-size:17px;font-weight:600">Перезагрузить</button>' +
            '<button id="b-reset" style="display:block;width:100%;height:52px;border:0;border-radius:16px;background:rgba(255,255,255,.08);' +
            'color:#F2F3F8;font-size:16px">Сбросить кэш приложения (данные останутся)</button>';
          box.innerHTML = html;
          box.querySelector('pre').textContent = lines.join('\n');
          document.body.appendChild(box);
          document.getElementById('b-reload').onclick = function () { location.reload(); };
          document.getElementById('b-reset').onclick = function () {
            if (!window.confirm('Сбросить офлайн-кэш Financy? Для повторной загрузки понадобится интернет. Финансовые данные останутся на устройстве.')) return;
            var jobs = [];
            var own = document.createElement('a');
            own.href = '%BASE_URL%';
            var scope = own.href;
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.filter(function (r) { return r.scope === scope; }).map(function (r) { return r.unregister(); })); }));
            if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf('workbox-') === 0 && k.slice(-scope.length) === scope; }).map(function (k) { return caches.delete(k); })); }));
            Promise.all(jobs).then(function () { location.reload(); }, function () { location.reload(); });
          };
        }

        window.__boot = {
          stage: function (s) { state.stage = s; },
          done: function () { state.done = true; },
          fail: function (title, err) { if (err) errors.unshift(msg(err)); show(title); }
        };
        setTimeout(function () {
          if (state.done) return;
          show('Приложение не запустилось',
            state.stage === 'html' ? 'Основной скрипт не выполнился: он не загрузился или браузер не смог его разобрать.' : '');
        }, 10000);
      })();
    </script>
    <script nomodule>
      window.__boot && __boot.fail('Браузер слишком старый', 'Нужен Safari 15 или новее (iOS 15+).');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
