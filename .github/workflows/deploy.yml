# Builds the app and publishes it to GitHub Pages.
# Runs only when you push to `main` or start it manually (Actions → Deploy → Run workflow).
# Enable once: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # project site lives at https://<user>.github.io/<repo>/
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_PICKER_API_KEY: ${{ vars.GOOGLE_PICKER_API_KEY }}
          VITE_GOOGLE_PROJECT_NUMBER: ${{ vars.GOOGLE_PROJECT_NUMBER }}
      - name: Guard — no certificates, keys or backups in the published files
        run: |
          if find dist \( -name '*.key' -o -name '*.pem' -o -name '*.crt' -o -name 'finance-backup-*' -o -name '*.csv' \) | grep -q .; then
            echo "Sensitive file found in dist/"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
